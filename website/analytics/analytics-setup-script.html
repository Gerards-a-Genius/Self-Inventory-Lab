<!-- Add this to the <head> section of all your HTML pages -->

<!-- Option 1: Google Analytics 4 -->
<!-- Replace G-XXXXXXXXXX with your actual Measurement ID -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);} 
  gtag('js', new Date());
  
  // Basic configuration
  gtag('config', 'G-XXXXXXXXXX', {
    // Enhanced measurement for better insights
    'page_title': document.title,
    'page_location': window.location.href,
    'page_path': window.location.pathname
  });
  
  // Track booking button clicks
  document.addEventListener('DOMContentLoaded', function() {
    // Track all booking links
    const bookingLinks = document.querySelectorAll('a[href*="HeatherWhitakerCoaching.as.me"]');
    bookingLinks.forEach(link => {
      link.addEventListener('click', function() {
        gtag('event', 'book_session', {
          'event_category': 'engagement',
          'event_label': 'Booking Link Click',
          'value': 1
        });
      });
    });
    
    // Track social media clicks
    const socialLinks = document.querySelectorAll('a[href*="linkedin.com"], a[href*="instagram.com"]');
    socialLinks.forEach(link => {
      link.addEventListener('click', function() {
        const platform = this.href.includes('linkedin') ? 'LinkedIn' : 'Instagram';
        gtag('event', 'social_click', {
          'event_category': 'engagement',
          'event_label': platform,
          'value': 1
        });
      });
    });
  });
</script>
